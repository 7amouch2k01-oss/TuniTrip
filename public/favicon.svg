<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0A4D68" />
      <stop offset="50%" stopColor="#088395" />
      <stop offset="100%" stopColor="#055A6E" />
    </linearGradient>
    <linearGradient id="lightGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF4CC" />
      <stop offset="60%" stopColor="#FDE68A" />
      <stop offset="100%" stopColor="#F59E0B" />
    </linearGradient>
    <linearGradient id="deepGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#E5A93C" />
      <stop offset="60%" stopColor="#D4AF37" />
      <stop offset="100%" stopColor="#B45309" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="40" height="40" rx="10" fill="url(#bgGrad)" />
  <rect x="0.5" y="0.5" width="39" height="39" rx="9.5" stroke="#088395" strokeOpacity="0.6" />

  <!-- Astrolabe Orbit Ring -->
  <circle cx="20" cy="20" r="14.5" stroke="#FDE68A" strokeWidth="0.75" strokeOpacity="0.4" strokeDasharray="1.5 2" />

  <!-- 4 Sub-cardinal Diamond Points (NE, NW, SE, SW) -->
  <polygon points="20,20 26,14 20,18" fill="url(#lightGold)" fillOpacity="0.5" />
  <polygon points="20,20 26,14 18,20" fill="url(#deepGold)" fillOpacity="0.4" />
  <polygon points="20,20 14,14 20,18" fill="url(#lightGold)" fillOpacity="0.5" />
  <polygon points="20,20 14,14 18,20" fill="url(#deepGold)" fillOpacity="0.4" />
  <polygon points="20,20 26,26 20,22" fill="url(#deepGold)" fillOpacity="0.4" />
  <polygon points="20,20 26,26 22,20" fill="url(#lightGold)" fillOpacity="0.5" />
  <polygon points="20,20 14,26 20,22" fill="url(#deepGold)" fillOpacity="0.4" />
  <polygon points="20,20 14,26 18,20" fill="url(#lightGold)" fillOpacity="0.5" />

  <!-- 4-Point Faceted Compass Star -->
  <!-- North -->
  <polygon points="20,20 20,5 17,20" fill="url(#deepGold)" />
  <polygon points="20,20 20,5 23,20" fill="url(#lightGold)" />
  <!-- South -->
  <polygon points="20,20 20,35 17,20" fill="url(#lightGold)" />
  <polygon points="20,20 20,35 23,20" fill="url(#deepGold)" />
  <!-- East -->
  <polygon points="20,20 35,20 20,17" fill="url(#lightGold)" />
  <polygon points="20,20 35,20 20,23" fill="url(#deepGold)" />
  <!-- West -->
  <polygon points="20,20 5,20 20,17" fill="url(#deepGold)" />
  <polygon points="20,20 5,20 20,23" fill="url(#lightGold)" />

  <!-- Center Jewel -->
  <circle cx="20" cy="20" r="3.2" fill="#FAF7F2" stroke="#0A4D68" strokeWidth="0.8" />
  <circle cx="20" cy="20" r="1.8" fill="#0A4D68" />
  <circle cx="19.3" cy="19.3" r="0.6" fill="#FFFFFF" />
</svg>